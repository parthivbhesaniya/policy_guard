services:
  api:
    build: .
    image: policyguard:latest
    command: ["uvicorn", "policyguard.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./checkpoints.sqlite:/app/checkpoints.sqlite
      - ./data:/app/data:ro
      - ~/.cache/chroma:/root/.cache/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build: .
    image: policyguard:latest
    command: ["streamlit", "run", "src/policyguard/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POLICYGUARD_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy

  ingest:
    build: .
    image: policyguard:latest
    profiles: ["tools"]
    command: ["python", "-m", "policyguard.ingestion.ingest", "--input", "data/policies", "--persist-dir", "./chroma_db"]
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data:ro
      - ~/.cache/chroma:/root/.cache/chroma
